name: Release

# Tests run in .github/workflows/tests.yml (on every push/PR to main), not here.
# This workflow assumes the tagged commit has already passed there.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Compute SHA-256 checksum
        id: checksum
        run: |
          SUM=$(shasum -a 256 .build/Portly.dmg | awk '{print $1}')
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          echo "$SUM  Portly.dmg" > .build/Portly.dmg.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/Portly.dmg
            .build/Portly.dmg.sha256
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          append_body: |

            **SHA-256**: `${{ steps.checksum.outputs.sha256 }}`

      # Requires a `HOMEBREW_TAP_TOKEN` repo secret: a PAT (classic, `repo` scope,
      # or fine-grained with contents:write) for hellohopper/homebrew-portly.
      # Skipped on workflow_dispatch (draft) releases and if the secret isn't set.
      - name: Bump hellohopper/homebrew-portly
        if: github.event_name != 'workflow_dispatch' && env.HOMEBREW_TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="${{ steps.checksum.outputs.sha256 }}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/hellohopper/homebrew-portly.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/portly.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/portly.rb

          git config user.name "portly-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Casks/portly.rb
          git commit -m "Bump Portly to v${VERSION}"
          git push
