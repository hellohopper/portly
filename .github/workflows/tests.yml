name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Run tests
        timeout-minutes: 10
        run: swift test

      # A crashing test binary loses its buffered output, leaving only "exit code
      # 1" in the log; the crash report is the only record of what happened.
      - name: Print crash reports
        if: failure()
        run: |
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/*PortlyPackageTests* 2>/dev/null | head -2); do
            echo "=== $report"
            head -c 20000 "$report"
          done
