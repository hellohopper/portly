name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Run tests
        timeout-minutes: 10
        run: swift test --xunit-output test-results.xml

      # A crashing test binary loses its buffered output, leaving only "exit code
      # 1" in the log; the crash report is the only record of what happened.
      - name: Print test results
        if: failure()
        run: |
          # Written by the test binary itself, so it survives even when its stdout
          # doesn't make it into the log.
          for results in test-results*.xml; do
            echo "=== $results"
            wc -c "$results"
            # Failures, plus anything slow enough to be the reason the run drags.
            tr '>' '\n' < "$results" | grep -E '<testsuite |<failure|time="[0-9]{2,}|message=' | head -80 || true
            head -c 3000 "$results"; echo
          done

      - name: Print crash reports
        if: failure()
        run: |
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/*PortlyPackageTests* 2>/dev/null | head -2); do
            echo "=== $report"
            head -c 20000 "$report"
          done

      - name: Isolate failing suites
        if: failure()
        timeout-minutes: 15
        run: |
          # Re-run each suite on its own; a suite whose run dies without a summary
          # (killed by a signal) is reported with its exit status.
          for suite in $(ls Tests/PortlyTests | sed 's/\.swift$//'); do
            out=$(swift test --skip-build --filter "${suite}" 2>&1); status=$?
            summary=$(echo "$out" | grep -E "Test run with" | tail -1)
            if [ $status -ne 0 ] || [ -z "$summary" ]; then
              echo "=== ${suite}: exit ${status}"
              echo "$out" | grep -vE "started\.|passed after" | tail -15
            fi
          done
